name: Package browser extensions

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to receive ZIP assets (optional)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package extensions
        shell: pwsh
        run: ./scripts/package-extensions.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-extension-packages
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
