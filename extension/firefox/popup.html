<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AI 素材提取器</title>
    <style>
        * { box-sizing: border-box; }
        body { width: 320px; margin: 0; color: #202124; background: #fff; font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
        header { padding: 18px 18px 15px; border-bottom: 1px solid #ececec; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; background: #202124; color: white; font-size: 18px; }
        h1 { margin: 0; font-size: 16px; } .version { color: #999; font-size: 11px; font-weight: 400; }
        .subtitle { margin: 5px 0 0 44px; color: #777; font-size: 12px; }
        main { padding: 15px 16px; }
        .section { padding: 12px; border: 1px solid #e7e7e7; border-radius: 8px; background: #fafafa; }
        .section + .section { margin-top: 10px; }
        .row { display: flex; align-items: flex-start; gap: 9px; }
        .row + .row { margin-top: 13px; }
        input[type=checkbox] { width: 16px; height: 16px; margin: 1px 0 0; accent-color: #202124; }
        .title { font-weight: 600; } .desc { margin-top: 3px; color: #777; font-size: 11px; line-height: 1.45; }
        select { width: 100%; margin-top: 7px; padding: 6px 7px; border: 1px solid #d5d5d5; border-radius: 5px; background: #fff; color: #333; }
        .status { min-height: 16px; margin-top: 10px; color: #38764a; font-size: 11px; }
        .links { display: flex; gap: 8px; }
        .link { flex: 1; padding: 8px 5px; border: 1px solid #ddd; border-radius: 6px; color: #333; text-align: center; text-decoration: none; font-size: 12px; }
        .link:hover { border-color: #202124; background: #fff; }
        button.link { cursor: pointer; background: #fff; }
        footer { padding: 10px 16px 13px; color: #aaa; text-align: center; font-size: 11px; }
    </style>
</head>
<body>
    <header>
<div class="brand"><div class="brand-icon" aria-hidden="true">▣</div><h1>AI 素材提取器 <span class="version">v0.6.2</span></h1></div>
        <p class="subtitle">提取图片与视频，快速保存到本地</p>
    </header>
    <main>
        <section class="section">
            <label class="row"><input id="auto-download" type="checkbox"><span><span class="title">自动下载新素材</span><br><span class="desc">检测到新图片或视频后自动保存，默认关闭。</span></span></label>
            <label class="row"><span style="width:100%"><span class="title">Dola 视频时长</span><br><span class="desc">仅对 Dola 生成请求生效，30 秒取决于账号和模型。</span><select id="dola-video-duration" aria-label="Dola 视频时长"><option value="0">按平台默认时长</option><option value="15">15 秒</option><option value="30">30 秒（实验）</option></select></span></label>
            <button id="clear-history" class="link" type="button">清除自动下载记录</button>
            <div id="setting-status" class="status" aria-live="polite"></div>
        </section>
        <section class="section">
            <div class="title">支持的平台</div>
            <div class="desc">豆包 · Dola · 千问</div>
            <div class="links" style="margin-top:10px"><a class="link" href="https://github.com/scj725/ai-media-extractor" target="_blank" rel="noreferrer">GitHub 项目</a><a class="link" href="https://github.com/scj725/ai-media-extractor/issues" target="_blank" rel="noreferrer">反馈问题</a></div>
        </section>
    </main>
    <footer>所有处理均在浏览器本地完成</footer>
    <script src="popup.js"></script>
</body>
</html>
